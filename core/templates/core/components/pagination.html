{% if ada_previous or ada_next %}
    <div class="d-flex justify-content-center align-items-center gap-3 mt-4"
        id="navigasiPimpinan">

        {% if ada_previous %}
            <a
                href="?{% if kata_kunci %}q={{ kata_kunci|urlencode }}&{% endif %}page={{ halaman|add:'-1' }}#{{ pagination_anchor }}"
                class="btn btn-outline-success rounded-pill px-4"
            >
                <i class="bi bi-chevron-left"></i>
                Sebelumnya
            </a>
        {% else %}
            <button
                type="button"
                class="btn btn-outline-success rounded-pill px-4"
                disabled
            >
                <i class="bi bi-chevron-left"></i>
                Sebelumnya
            </button>
        {% endif %}

        <span class="fw-semibold">
            Halaman {{ halaman }}
        </span>

        {% if ada_next %}
            <a
                href="?{% if kata_kunci %}q={{ kata_kunci|urlencode }}&{% endif %}page={{ halaman|add:'1' }}#{{ pagination_anchor }}"
                class="btn btn-success rounded-pill px-4"
            >
                Selanjutnya
                <i class="bi bi-chevron-right"></i>
            </a>
        {% else %}
            <button
                type="button"
                class="btn btn-success rounded-pill px-4"
                disabled
            >
                Selanjutnya
                <i class="bi bi-chevron-right"></i>
            </button>
        {% endif %}

    </div>
{% endif %}

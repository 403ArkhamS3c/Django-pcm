<article class="agenda-card">

    <div class="agenda-date">
        <span class="agenda-day">
            {{ entri.waktu_mulai|date:"d" }}
        </span>

        <span class="agenda-month">
            {{ entri.waktu_mulai|date:"M Y" }}
        </span>
    </div>

    <div class="agenda-content">

        <span class="agenda-category">
            AGENDA PCM
        </span>

        <h3 class="agenda-title">
            {{ entri.nama_kegiatan }}
        </h3>

        <div class="agenda-meta">
            <span>
                <i class="bi bi-clock" aria-hidden="true"></i>
                {{ entri.waktu_mulai|date:"H:i" }} WIB
            </span>

            <span>
                <i class="bi bi-geo-alt" aria-hidden="true"></i>
                {{ entri.tempat }}
            </span>
        </div>

        {% if entri.keterangan %}
            <p class="agenda-description">
                {{ entri.keterangan|truncatewords:30 }}
            </p>
        {% endif %}

        <a
            class="agenda-link"
            href="{% url 'detail_agenda' entri.pk %}"
        >
            Lihat detail
            <i class="bi bi-arrow-right"></i>
        </a>

    </div>

</article>

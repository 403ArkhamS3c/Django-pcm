
<header class="hero text-center"
    {% if hero_image %}
        style="background-image: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.5)), url('{{ hero_image }}');"
    {% endif %}>
    <div class="container">
        <span class="hero-label">{{ hero_label }}</span>
        <h1>{{ hero_title }}</h1>
        <p>{{ hero_description }}</p>
    </div>
</header>
